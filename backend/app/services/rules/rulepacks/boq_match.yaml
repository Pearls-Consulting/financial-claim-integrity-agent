# Gate 2 — BoQ / contract match. Per-contract parameters (unit prices,
# payment schedule) come from the contract & BoQ themselves; the procurement
# law's Executive Regulations govern مستخلصات sequencing and limits.
rules:
  - id: boq.lines_match
    title_en: Invoice lines match the Bill of Quantities
    title_ar: مطابقة بنود الفاتورة مع جدول الكميات
    check: boq_lines_match
    severity: fail
    source: { doc: contract, ref: BoQ }

  - id: boq.cumulative_within_contract
    title_en: Cumulative claims within contract value
    title_ar: إجمالي المطالبات ضمن قيمة العقد
    check: cumulative_within_contract
    severity: fail
    source: { doc: Procurement Law Exec. Regulations, ref: progress payments }

  - id: boq.payment_not_already_disbursed
    title_en: Payment number was not disbursed before
    title_ar: رقم الدفعة لم يُصرف مسبقاً
    check: payment_not_already_disbursed
    severity: fail
    # Verbatim rejection reason observed in the client's استلام المطالبات
    # screen; normative anchor pending POC-P01.
    source: { doc: Client rejection practice (D365), ref: "رقم الدفعة تم صرفها مسبقاً" }

  - id: boq.payment_sequence
    title_en: Payment number follows the prior sequence
    title_ar: رقم الدفعة يتبع تسلسل الدفعات السابقة
    check: payment_sequence
    severity: warn
    source: { doc: contract, ref: payment schedule }

  - id: boq.claim_type_consistent
    title_en: Claim type agrees with the payment history
    title_ar: نوع المستخلص متسق مع سجل الدفعات
    check: claim_type_consistent
    severity: fail
    # 'تعديل نوع المستخلص لدوري' is a verbatim rejection reason in the client's
    # claims screen. The should-be-final case downgrades itself to warn.
    source: { doc: Client rejection practice (D365), ref: "تعديل نوع المستخلص لدوري" }

  - id: boq.final_claim_closes_contract
    title_en: Final claim closes out the contract value
    title_ar: الدفعة النهائية تغلق كامل قيمة العقد
    check: final_claim_closes_contract
    severity: warn
    source: { doc: Procurement Law Exec. Regulations, ref: final settlement }
