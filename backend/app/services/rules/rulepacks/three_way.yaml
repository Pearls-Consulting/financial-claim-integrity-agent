# Gate 3 — acceptance & three-way match: contract/BoQ ↔ acceptance document
# ↔ invoice. One acceptance document per contract kind (goods receipt for
# goods, محضر الإنجاز for works); the ERP product receipt the procedure posts
# (SPM-PM01 §9.3 step 5) is a cross-check when it exists, never a second
# acceptance. The comparison criterion comes from the procurement law (pay
# only for executed/received work) and the contract's BoQ.
rules:
  - id: three_way.acceptance_present
    title_en: Acceptance document present for the contract kind
    title_ar: وجود مستند الاستلام المناسب لنوع العقد
    check: acceptance_present
    severity: warn
    source: { doc: SPM-PM01, ref: "§9.3 step 5 — الاستلام" }

  - id: three_way.coc_amount_matches_claim
    title_en: COC amount matches the claim total
    title_ar: مبلغ محضر الإنجاز يطابق إجمالي المطالبة
    check: coc_amount_matches_claim
    severity: fail
    source: { doc: SP-01-04-05-02, ref: steps 3-4 }

  - id: three_way.coc_invoice_ref
    title_en: COC issued for this claim's invoice
    title_ar: محضر الإنجاز صادر لفاتورة هذه المطالبة
    check: coc_invoice_ref_matches
    severity: fail
    source: { doc: SP-01-04-05-02, ref: "step 3 — محضر الإنجاز (رقم المطالبة المالية)" }

  - id: three_way.coc_amounts_match_invoice
    title_en: COC net and VAT match the invoice
    title_ar: مبلغ المحضر قبل الضريبة وضريبته يطابقان الفاتورة
    check: coc_amounts_match_invoice
    severity: fail
    source: { doc: SP-01-04-05-02, ref: steps 3-4 }

  - id: three_way.coc_payment_matches_claim
    title_en: COC payment ordinal and claim type match the claim
    title_ar: ترتيب الدفعة ونوع المستخلص في المحضر يطابقان المطالبة
    check: coc_payment_matches_claim
    severity: fail
    source: { doc: SP-01-04-05-02, ref: "claim metadata — رقم الدفعة / نوع المستخلص" }

  - id: three_way.coc_contract_value
    title_en: COC contract value matches the contract
    title_ar: قيمة العقد في المحضر تطابق العقد
    check: coc_contract_value_matches
    severity: fail
    source: { doc: contract, ref: "contract value incl. VAT (قيمة التعميد)" }

  - id: three_way.coc_award_letter
    title_en: COC award letter number matches the filed award letter
    title_ar: رقم خطاب الترسية في المحضر يطابق الخطاب المرفق
    check: coc_award_letter_matches
    severity: warn
    source: { doc: SP-01-04-05-02, ref: "required attachments — خطاب الترسية" }

  - id: three_way.billed_vs_received
    title_en: Quantities billed do not exceed quantities received
    title_ar: الكميات المفوترة لا تتجاوز الكميات المستلمة
    check: billed_vs_received
    severity: fail
    source: { doc: Procurement Law Exec. Regulations, ref: payment for executed work }

  - id: three_way.received_within_boq
    title_en: Quantities received stay within the contracted BoQ
    title_ar: الكميات المستلمة ضمن كميات جدول الكميات
    check: received_within_boq
    severity: fail
    source: { doc: contract, ref: BoQ quantities }

  - id: three_way.claimed_within_certified_value
    title_en: Claimed amount within the value of received work
    title_ar: مبلغ المطالبة ضمن قيمة الأعمال المستلمة
    check: claimed_within_certified_value
    severity: fail
    source: { doc: Procurement Law Exec. Regulations, ref: progress payments }
