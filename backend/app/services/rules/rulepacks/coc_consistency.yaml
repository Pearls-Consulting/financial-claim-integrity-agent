# Gate 3 — COC consistency. The procedure has NO control here; these rules
# exist because vendor input feeds the auto-generated COC and the client's own
# example (penalized vendor, COC says "no delay") slipped through every gate.
rules:
  - id: coc.amount_matches_claim
    title_en: COC amount matches the claim total
    title_ar: مبلغ محضر الإنجاز يطابق إجمالي المطالبة
    check: coc_amount_matches_claim
    severity: fail
    source: { doc: SP-01-04-05-02, ref: steps 3-4 }

  - id: coc.delay_vs_penalties
    title_en: COC delay/stoppage answers consistent with penalties
    title_ar: اتساق إجابات التأخير والإيقاف مع سجل الغرامات
    check: coc_delay_vs_penalties
    severity: fail
    source: { doc: internal audit, ref: client-reported contradiction case }
